name: Deploy Next.js App to VPS

on:
  push:
    branches:
      - main # Trigger deployment on changes to this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up SSH key
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WASHINGTON_PIPLINE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 31.97.133.203 >> ~/.ssh/known_hosts

      # Step 3: Deploy and Restart app using PM2
      - name: Deploy and Restart app using PM2 on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 root@31.97.133.203 <<'EOF'
            set -e  # ❌ Stop immediately if any command fails

            cd bolton-nextjs

            # Pull latest code with token auth
            git reset --hard
            git pull https://${{ secrets.REPO_PAT }}@github.com/syedmuhammadbilalgillani/bolton-nextjs.git main

            # Clean cache, old builds
            rm -rf .next
            npm cache clean --force

            # Install fresh dependencies and build
            npm install
            npm run build

            # Restart with PM2 (start if not already running)
            pm2 restart bolton_nextjs || pm2 start npm --name bolton_nextjs -- start
          EOF
        env:
          GITHUB_PAT: ${{ secrets.REPO_PAT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.WASHINGTON_PIPLINE_SSH_KEY }}
